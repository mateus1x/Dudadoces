<span data-preco-id="brownie-bite">R$ 3,50</span>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1OG_cVe9eGIB_xabKZUW1-vwTSfrSRew",
        authDomain: "dudadoces.firebaseapp.com",
        projectId: "dudadoces",
        storageBucket: "dudadoces.firebasestorage.app",
        messagingSenderId: "616273504505",
        appId: "1:616273504505:web:492fb9185a1cc0d1b5da28",
        measurementId: "G-9NZ8YG2YD4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Mapa global acessível pelo script do seu carrinho/pedidos no index.html
    window.precosCatalogoDuda = {};

    onSnapshot(doc(db, "configuracoes", "catalogo_loja"), (snap) => {
        if (!snap.exists() || !Array.isArray(snap.data().itens)) return;

        snap.data().itens.forEach((item) => {
            if (!item.id) return;
            const valorNum = Number(item.preco) || 0;
            window.precosCatalogoDuda[item.id] = valorNum;

            document.querySelectorAll(`[data-preco-id="${item.id}"]`).forEach((el) => {
                el.textContent = valorNum.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });
            });
        });

        window.dispatchEvent(new CustomEvent("duda:precos-atualizados", {
            detail: window.precosCatalogoDuda
        }));
    });
</script>
